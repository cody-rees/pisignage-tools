# Series rotation settings.
#
# Each show gets its own section. source_glob matches the season folders on the
# SSD (they are played in natural sort order, so name them ..._s01, ..._s02 ...).
# output_dir is the folder to use as the PiSignage "Local Files and folders"
# asset. It must be on the SD card: exFAT cannot hold symlinks.

[settings]
state_dir = /home/pi/pisignage-tools/series-rotation/state
log_file = /home/pi/pisignage-tools/series-rotation/rotation.log
# The folder is rebuilt whenever this log shows PiSignage turning the TV off.
pisignage_log = /home/pi/forever_out.log

[happy_days]
source_glob = /media/pi/ssd/happy_days_s*
output_dir = /home/pi/rotation/happy_days
